[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxkernel"
version = "0.1.0"
description = "A bounded view over an append-only event log, for agents that run long."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Tilekar" }]
keywords = ["llm", "agents", "context", "context-management", "compaction", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fast = ["xxhash>=3.4"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
tiktoken = ["tiktoken>=0.7"]
jev = ["typesafe-sdk"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["ctxkernel"]

# Ship the package, the docs a user needs, and the tests. Everything listed in
# .gitignore -- the internal design notes, the visual explainer, runtime .ctx
# output -- stays out of the distribution.
[tool.hatch.build.targets.sdist]
include = [
    "/ctxkernel",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/QUICKSTART.md",
    "/try_it.py",
    "/pyproject.toml",
]
exclude = [
    "ARCHITECTURE.md",
    "SDK-DESIGN.md",
    "ctxkernel-explained.html",
    "**/.ctx*",
    "**/__pycache__",
    "**/*.db",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
